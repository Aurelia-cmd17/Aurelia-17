function render(){
  const s=stages[current-1];
  document.getElementById("stage").textContent=`GATE ${current} / 50`;
  document.getElementById("puzzle").textContent=s.puzzle;
  document.getElementById("clue").textContent=s.clue;
  document.getElementById("bar").style.width=(current/50*100)+"%";
  document.getElementById("result").textContent="";
  document.getElementById("answer").value="";
}
function submitAnswer(){
  const value=document.getElementById("answer").value.trim().toLowerCase();
  const result=document.getElementById("result");
  // Gates 1-5 have example unlock answers; later gates are intentionally
  // left for you to customize with your own puzzle solutions.
  if(current<=5 && value===answers[current]){
    if(current===50){ result.textContent="THE FINAL GATE OPENS."; return; }
    current++;
    localStorage.setItem("aureliaStage",current);
    result.textContent="ACCESS GRANTED.";
    setTimeout(render,700);
  } else if(current>5 && value==="open"){
    current++;
    if(current>50) current=50;
    localStorage.setItem("aureliaStage",current);
    result.textContent="ACCESS GRANTED.";
    setTimeout(render,700);

    result.textContent="ACCESS DENIED.";
  }
}
